name: Production Continuous Deployment — Hostinger

on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:

concurrency:
  group: 'production-deployment'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Validate, Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛡️ Pre-deploy Validation (Typecheck & Lint)
        run: npm run lint

      - name: 🏗️ Compile Production Bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 🚀 Deploy Dist Artifacts to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR || 'public_html/' }}
          local-dir: './dist/'
          protocol: ftps
          dangerous-clean-slate: false
