name: Production Continuous Deployment — Hostinger

on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:

concurrency:
  group: 'production-deployment'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Validate, Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛡️ Pre-deploy Validation (Typecheck & Lint)
        run: npm run lint

      - name: 🏗️ Compile Production Bundle
        run: |
          export VITE_SUPABASE_URL="${VITE_SUPABASE_URL:-https://khagzrjxoqwzqrikomrd.supabase.co}"
          export VITE_SUPABASE_ANON_KEY="${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoYWd6cmp4b3F3enFyaWtvbXJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NzAwOTUsImV4cCI6MjEwNzA0NjA5NX0.pUav2uMVkrKTs-iL4s5RLvrvLmfqUPnPtxjwsF-sQU0}"
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 🚀 Deploy Dist Artifacts to Hostinger
        if: secrets.HOSTINGER_FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR || 'public_html/' }}
          local-dir: './dist/'
          protocol: ftps
          dangerous-clean-slate: false

      - name: ℹ️ Deployment Notice
        if: secrets.HOSTINGER_FTP_SERVER == ''
        run: |
          echo "::notice title=FTP Secrets Pending::El bundle de producción compiló exitosamente. Para despliegue continuo vía FTP en GitHub Actions, configura HOSTINGER_FTP_SERVER, HOSTINGER_FTP_USERNAME y HOSTINGER_FTP_PASSWORD en GitHub Secrets."

