name: Weekly Security Review

on:
  schedule:
    # Every Monday at 13:00 UTC (07:00 Guatemala)
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-security:
    name: Code, tests and dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security test suite
        run: npm run test:security

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Full dependency audit
        run: npm audit

      - name: Built .htaccess matches source
        run: diff -u public/.htaccess dist/.htaccess

      - name: Build artifacts present
        run: |
          test -f dist/font-loader.js
          test -f dist/.htaccess
          ! grep -E '\son[a-z]+\s*=' dist/index.html

      - name: Repository secret scan
        run: |
          if git grep -n -E 'SB_SECRET_[A-Za-z0-9_-]+|sk_live_[A-Za-z0-9]+|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[^#[:space:]]' -- . \
            ':(exclude)package-lock.json' ':(exclude)docs/**' ':(exclude)*.md'; then
            echo "::error::Potential secret found in tracked files"
            exit 1
          else
            echo "No obvious secrets found"
          fi

  live-security:
    name: Live headers and sensitive files (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check live headers
        run: |
          echo "## Live security headers" >> "$GITHUB_STEP_SUMMARY"
          echo '```http' >> "$GITHUB_STEP_SUMMARY"
          curl -sSI https://ideasycoloresgt.site/ | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check sensitive files
        run: |
          echo "## Sensitive file status" >> "$GITHUB_STEP_SUMMARY"
          echo '| URL | HTTP |' >> "$GITHUB_STEP_SUMMARY"
          echo '| :--- | :--- |' >> "$GITHUB_STEP_SUMMARY"
          for path in .env .git/config tsconfig.json package-lock.json; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://ideasycoloresgt.site/$path")
            echo "| /$path | $code |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Check DNS records
        run: |
          echo "## DNS" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          for name in ideasycoloresgt.site _dmarc.ideasycoloresgt.site ideasycoloresgt.com _dmarc.ideasycoloresgt.com; do
            echo "== $name ==" >> "$GITHUB_STEP_SUMMARY"
            (dig +short TXT "$name" || true) >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
